---
# ──────────────────────────────────────────────
# Global Variables (apply to all hosts)
# ──────────────────────────────────────────────

# SSH user for connecting to nodes

# ansible_ssh_private_key_file: /home/dc/Downloads/jenkins-key.pem
ansible_private_key_file: /home/dc/Downloads/jenkins-key.pem

# Terraform version to install
terraform_version: "1.9.8"

# AWS CLI version (v2)
awscli_version: "2"

# Jenkins settings
jenkins_http_port: 8080

# Docker settings
docker_edition: "ce"
docker_compose_install: true
