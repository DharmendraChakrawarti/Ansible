---
# Jenkins installation tasks for Ubuntu

- name: (Ubuntu) Import active Jenkins GPG key
  ansible.builtin.shell: |
    gpg --no-default-keyring --keyring /etc/apt/trusted.gpg.d/jenkins.gpg --keyserver keyserver.ubuntu.com --recv-keys 7198F4B714ABFC68
    chmod 644 /etc/apt/trusted.gpg.d/jenkins.gpg

- name: (Ubuntu) Add Jenkins APT repository
  ansible.builtin.shell: |
    echo "deb [signed-by=/etc/apt/trusted.gpg.d/jenkins.gpg] https://pkg.jenkins.io/debian-stable binary/" | tee /etc/apt/sources.list.d/jenkins.list > /dev/null

- name: (Ubuntu) Update apt cache
  ansible.builtin.apt:
    update_cache: true

- name: (Ubuntu) Install Jenkins
  ansible.builtin.apt:
    name: jenkins
    state: present
