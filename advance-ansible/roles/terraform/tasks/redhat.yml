---
# Terraform installation tasks for RedHat / CentOS / RHEL

- name: (RedHat) Install yum-config-manager
  ansible.builtin.dnf:
    name: yum-utils
    state: present

- name: (RedHat) Add HashiCorp repository
  ansible.builtin.command: >
    yum-config-manager --add-repo
    https://rpm.releases.hashicorp.com/RHEL/hashicorp.repo
  args:
    creates: /etc/yum.repos.d/hashicorp.repo

- name: (RedHat) Install Terraform
  ansible.builtin.dnf:
    name: terraform
    state: present
