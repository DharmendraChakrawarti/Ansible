---
# Terraform Role - Main Task Entry Point
# Installs official HashiCorp Terraform binary (compatible with all Linux distros and versions)

- name: Display target OS info
  ansible.builtin.debug:
    msg: "Installing Terraform {{ terraform_version }} on {{ ansible_distribution }} {{ ansible_distribution_version }}"

- name: Determine system architecture
  ansible.builtin.set_fact:
    tf_arch: "{{ 'arm64' if ansible_architecture == 'aarch64' else 'amd64' }}"

- name: Check if Terraform is already installed
  ansible.builtin.command: terraform version
  register: tf_check
  changed_when: false
  failed_when: false

- name: Install unzip package (Debian-based)
  ansible.builtin.apt:
    name: unzip
    state: present
  when: ansible_os_family == "Debian" and tf_check.rc != 0

- name: Install unzip package (RedHat-based)
  ansible.builtin.yum:
    name: unzip
    state: present
  when: ansible_os_family == "RedHat" and tf_check.rc != 0

- name: Download Terraform binary zip
  ansible.builtin.get_url:
    url: "https://releases.hashicorp.com/terraform/{{ terraform_version }}/terraform_{{ terraform_version }}_linux_{{ tf_arch }}.zip"
    dest: "/tmp/terraform_{{ terraform_version }}.zip"
    mode: "0644"
  when: tf_check.rc != 0

- name: Unarchive Terraform to /usr/local/bin
  ansible.builtin.unarchive:
    src: "/tmp/terraform_{{ terraform_version }}.zip"
    dest: /usr/local/bin/
    remote_src: true
    mode: "0755"
  when: tf_check.rc != 0

- name: Clean up Terraform zip file
  ansible.builtin.file:
    path: "/tmp/terraform_{{ terraform_version }}.zip"
    state: absent
  when: tf_check.rc != 0

- name: Verify Terraform installation
  ansible.builtin.command: terraform version
  register: terraform_version_output
  changed_when: false

- name: Show Terraform version
  ansible.builtin.debug:
    msg: "{{ terraform_version_output.stdout_lines[0] }}"
