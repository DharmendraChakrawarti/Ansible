[defaults]
# Default inventory file
inventory = inventory/hosts.ini

# Default remote SSH user (change to your user, e.g., ubuntu, ec2-user)
remote_user = ansible

# Disable SSH host key checking for easy testing
host_key_checking = False

# Suppress retry files (.retry)
retry_files_enabled = False

# Privilege escalation (sudo)
[privilege_escalation]
become = True
become_method = sudo
become_user = root
become_ask_pass = False
