# ==========================================
# Basic Ansible Inventory (YAML Format)
# ==========================================
all:
  children:
    local:
      hosts:
        localhost:
          ansible_connection: local
    webservers:
      hosts:
        web1:
          ansible_host: 192.168.1.10
          ansible_user: ubuntu
        web2:
          ansible_host: 192.168.1.11
          ansible_user: ubuntu
    dbservers:
      hosts:
        db1:
          ansible_host: 192.168.1.20
          ansible_user: ec2-user
