# ==========================================
# Basic Ansible Inventory (INI Format)
# ==========================================

# Test on your local machine without needing remote servers!
[local]
localhost ansible_connection=local

# Web servers group (replace with your server IP addresses)
[webservers]
web1 ansible_host=192.168.1.10 ansible_user=ubuntu
web2 ansible_host=192.168.1.11 ansible_user=ubuntu

# Database servers group
[dbservers]
db1 ansible_host=192.168.1.20 ansible_user=ec2-user

# All servers combined into one parent group
[all_servers:children]
webservers
dbservers
