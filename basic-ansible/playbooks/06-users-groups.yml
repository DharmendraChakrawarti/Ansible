---
# ==========================================
# 06-users-groups.yml - Manage Users & Groups
# ==========================================
# Run command:
#   ansible-playbook playbooks/06-users-groups.yml

- name: Manage Linux Users and Groups
  hosts: all
  become: true

  tasks:
    - name: Ensure devops group exists
      ansible.builtin.group:
        name: devops
        state: present

    - name: Create developer user
      ansible.builtin.user:
        name: devuser
        comment: "Demo Developer User"
        group: devops
        shell: /bin/bash
        create_home: true
        state: present

    - name: Verify user exists
      ansible.builtin.getent:
        database: passwd
        key: devuser

    - name: Show user details
      ansible.builtin.debug:
        msg: "devuser found with UID {{ getent_passwd['devuser'][1] }} and Home {{ getent_passwd['devuser'][4] }}"
