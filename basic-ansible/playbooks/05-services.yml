---
# ==========================================
# 05-services.yml - Manage System Services
# ==========================================
# Run command:
#   ansible-playbook playbooks/05-services.yml

- name: Manage System Services
  hosts: all
  become: true

  tasks:
    - name: Ensure cron (cron/crond) service is started and enabled
      ansible.builtin.service:
        name: "{{ 'cron' if ansible_os_family == 'Debian' else 'crond' }}"
        state: started
        enabled: true

    - name: Check service status
      ansible.builtin.command: systemctl is-active {{ 'cron' if ansible_os_family == 'Debian' else 'crond' }}
      register: service_status
      changed_when: false

    - name: Print service state
      ansible.builtin.debug:
        msg: "Cron service is currently: {{ service_status.stdout }}"
