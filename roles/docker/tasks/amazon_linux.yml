---
# Docker installation tasks for Amazon Linux

- name: (Amazon) Remove old Docker packages
  ansible.builtin.yum:
    name:
      - docker
    state: absent

- name: (Amazon) Install prerequisite packages
  ansible.builtin.yum:
    name:
      - yum-utils
      - curl
      - unzip
    state: present

- name: (Amazon) Install Docker via amazon-linux-extras (AL2)
  ansible.builtin.shell: |
    amazon-linux-extras install docker -y
  when: ansible_distribution_major_version == "2"

- name: (Amazon) Install Docker on Amazon Linux 2023
  ansible.builtin.yum:
    name:
      - docker
    state: present
  when: ansible_distribution_major_version == "2023"
